name: Formal Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly
  workflow_dispatch: # Allow manual trigger
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  push:
    tags:
      - 'v*'

jobs:
  coverage_tarpaulin:
    name: Tarpaulin Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate Coverage Report
        run: cargo tarpaulin --verbose --workspace --timeout 120 --out html
      - name: Upload Coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-report
          path: tarpaulin-report.html

  miri_undefined_behavior:
    name: Miri Undefined Behavior Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Scoped to UB-sensitive arithmetic: full-suite Miri hangs on the 1024-bit
      # Miller-Rabin prime search and on the doctests (100k squarings), and
      # proptest requires disabling Miri's file-isolation for its getcwd call.
      - name: Run Miri (small-discriminant UB checks)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
          PROPTEST_CASES: "64"
        run: cargo miri test --lib --test proptest_math -- --skip test_discriminant_chia_test_vector --test-threads=1

  kani_formal_verification:
    name: AWS Kani Formal Proofs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - prove_isqrt_fourth_safe
    steps:
      - uses: actions/checkout@v4
      - name: Install Kani and verify ${{ matrix.harness }}
        uses: model-checking/kani-github-action@v1.0
        with:
          args: --tests --harness ${{ matrix.harness }}
